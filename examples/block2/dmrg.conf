! Block2 DMRG on an FCIDUMP written by g16dump.
!
! This file is the CH2 triplet example described in README.md: the active
! space of tests/data/ch2_rohf.npz, 12 orbitals and 6 electrons (4 alpha,
! 2 beta). The three numbers below are NORB, NELEC and MS2 from the FCIDUMP
! header; change them and nothing else to run a different dump.
!
! Run with:   block2main dmrg.conf > dmrg.out

sym c1
orbitals FCIDUMP

nelec 6
spin 2
irrep 1

hf_occ integral
schedule default
maxM 500
maxiter 30
sweep_tol 1E-10
