name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  # The core path is NumPy only. This job installs nothing else, so a stray
  # import of PySCF, MOKIT or gauopen into the core package fails CI rather
  # than being discovered on a cluster.
  numpy-only:
    name: "NumPy only (py${{ matrix.python }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (core only)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Confirm the optional dependencies really are absent
        run: |
          python - <<'PY'
          for name in ("pyscf", "mokit", "QCMatEl"):
              try:
                  __import__(name)
              except ImportError:
                  print(f"{name}: absent, as expected")
              else:
                  raise SystemExit(f"{name} is installed; this job must run without it")
          PY
      - name: Run the test suite
        run: python -m pytest tests/ -v

  # Gaussian and gauopen are never installed in CI. PySCF is, here only, so the
  # independent-oracle tests run.
  with-pyscf:
    name: "With PySCF (py${{ matrix.python }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install with the validation extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]" pyscf
      - name: Run the test suite
        run: python -m pytest tests/ -v
